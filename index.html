<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校務資訊系統</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            cursor: pointer;
        }

        #message {
            color: red;
            margin-top: 10px;
            text-align: center;
        }

        #content {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h1>校務資訊系統</h1>

    <input 
        type="password" 
        id="password" 
        placeholder="請輸入密碼"
    >

    <button onclick="login()">
        登入
    </button>

    <div id="message"></div>

    <div id="content"></div>
</div>

<script>
async function login() {

    const password = document.getElementById("password").value;

    const response = await fetch("/api/protected", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            password: password
        })
    });

    if (!response.ok) {
        document.getElementById("message").innerText = "密碼錯誤";
        return;
    }

    const html = await response.text();

    document.getElementById("content").innerHTML = html;

    document.getElementById("message").innerText = "";
}

document.getElementById("password")
.addEventListener("keypress", function(event) {

    if (event.key === "Enter") {
        login();
    }

});
</script>

</body>
</html>
